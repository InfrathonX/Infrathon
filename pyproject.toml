[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sforge"
version = "1.0.0"
description = "SForge: the Infrathon evaluation harness for coding agents"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["sforge/LICENSE", "sforge/NOTICE"]
authors = [{ name = "The Infrathon authors" }]
keywords = ["evaluation", "benchmark", "code-agent", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "docker>=7.0",
    "tqdm",
    "rich",
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "jinja2",
    "requests",
    "pyyaml>=6.0",
    "typing_extensions>=4.0",
    "huggingface-hub>=0.20",
]

[project.scripts]
sforge = "sforge.cli:main"
sforge-pyromind = "sforge.pyromind.cli:main"

[project.optional-dependencies]
pyromind = ["pyromind-sdk==0.1.10", "python-dotenv>=1.2,<2", "minio==7.2.20"]

[project.urls]
Homepage = "https://github.com/InfrathonX/Infrathon"
Repository = "https://github.com/InfrathonX/Infrathon"

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
only-include = ["sforge"]

[tool.hatch.build.targets.wheel]
packages = ["sforge"]
