<g><rect x="468" y="400" width="248" height="30" rx="8" style="fill: var(--train-soft); stroke: var(--train); stroke-opacity: .35"/><rect x="475" y="408" width="3.5" height="14" rx="1.75" style="fill: var(--train)"/><text x="487" y="419.5" style="font-size: 12.5px">Miles Wan2.2 DanceGRPO</text></g>
