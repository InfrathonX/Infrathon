# Fully pinned Python dependency closure for the Quant-VideoGen Work base.
#
# Every line is an exact version so a fresh clone reproduces the historical v2
# Work environment in terms of installed distributions.  The list is the
# difference between `pip freeze` inside
# pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel and `pip freeze` inside the
# validated v2 Work image, so every other distribution (torch, torchvision,
# torchaudio, triton, pillow, sympy, networkx, filelock, requests, ... and the
# conda-managed base packages) is inherited unchanged from the pinned base
# image and must not be reinstalled here.
#
# Installed with `pip install --no-deps`: the closure is already complete, so
# no resolver decision is taken at build time and no unpinned transitive
# dependency can enter the image.
#
# The two downgrades relative to the base image are deliberate upstream pins:
#   numpy     2.3.2 -> 1.26.4  (quant-videogen[longcat,selfforcing])
#   decorator 5.x   -> 4.4.2   (moviepy 1.0.3 requires decorator<5)
#
# flash_attn is the upstream prebuilt wheel for cp311 / torch 2.8 / cu12,
# pinned by release URL and by the sha256 in its fragment.
